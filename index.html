  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

et>\n\n<div dir=\"rtl\" style=\"font-family: 'Heebo', sans-serif; background: oklch(0.99 0.005 30); color: oklch(0.26 0.015 30); line-height: 1.5; overflow-x: hidden;\">\n\n  <!-- HERO -->\n  <section data-screen-label=\"hero\" style=\"display: grid; grid-template-columns: 1.05fr 0.95fr; min-height: 92vh; align-items: stretch;\">\n    <div style=\"display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 80px 64px; max-width: 640px;\">\n      <div style=\"display: inline-flex; align-items: center; gap: 8px; background: oklch(0.94 0.05 350); color: oklch(0.45 0.14 345); padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; width: fit-content;\">\n        <span style=\"width: 8px; height: 8px; border-radius: 50%; background: oklch(0.6 0.16 345);\"><\u002Fspan>\n        סטודיו אימונים לנשים בלבד\n      <\u002Fdiv>\n      <h1 style=\"font-family: 'Heebo', sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; margin: 0; color: oklch(0.22 0.015 30);\">\n        עצבי את הגוף שלך<br>דרך <span style=\"color: oklch(0.55 0.17 345);\">כוח אמיתי<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size: 20px; color: oklch(0.42 0.015 30); margin: 0; max-width: 480px;\">\n        בלי מעקב דיאטות כפייתי. בלי פחד משרירים \"מנופחים\". אימוני כוח מותאמים אישית שבונים ביטחון, כוח וגוף חטוב — בקצב שלך.\n      <\u002Fp>\n      <div style=\"display: flex; gap: 16px; align-items: center; margin-top: 8px;\">\n        <a href=\"https://wa.me/972500000000?text=%D7%94%D9%99%D7%99%2C%20%D7%90%D7%A0%D7%99%20%D7%9E%D7%A2%D7%95%D7%A0%D7%99%D7%99%D7%A0%D7%AA%20%D7%91%D7%A9%D7%99%D7%97%D7%AA%20%D7%94%D9%99%D7%9B%D7%A8%D7%95%D7%AA\" style=\"display: inline-flex; align-items: center; gap: 10px; background: oklch(0.55 0.17 345); color: white; font-size: 17px; font-weight: 600; padding: 17px 34px; border-radius: 999px; box-shadow: 0 12px 28px -8px oklch(0.55 0.17 345 / 0.55);\">\n          תיאום שיחת היכרות\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 28px; margin-top: 12px; color: oklch(0.5 0.01 30); font-size: 14px;\">\n        <span>✓ אימונים פרטניים וקבוצתיים<\u002Fspan>\n        <span>✓ סביבה נשית בלבד<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: relative; overflow: hidden;\">\n      <image-slot id=\"hero-main\" shape=\"rect\" placeholder=\"תמונת גיבור — המאמנת באימון כוח\" style=\"width: 100%; height: 100%;\" src=\"fc083b98-7af3-44d8-b417-be2d1678c0a0\"><\u002Fimage-slot>\n      <div style=\"position: absolute; inset: 0; background: linear-gradient(to left, oklch(0.99 0.005 30 / 0.35), transparent 25%); pointer-events: none;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CERTIFIED BADGE -->\n  <section data-screen-label=\"badge\" style=\"padding: 40px 64px; background: linear-gradient(120deg, oklch(0.95 0.045 350), oklch(0.93 0.045 230)); display: flex; justify-content: center; align-items: center; gap: 56px; flex-wrap: wrap;\">\n    <div style=\"display: flex; align-items: center; gap: 14px; color: oklch(0.26 0.02 300);\">\n      <div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.55 0.17 345); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0; color: white;\">✓<\u002Fdiv>\n      <div>\n        <div style=\"font-weight: 700; font-size: 17px;\">מאמנת כושר מוסמכת<\u002Fdiv>\n        <div style=\"font-size: 13px; color: oklch(0.42 0.02 300);\">הכשרה מקצועית באימוני כוח והתנגדות<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width: 1px; height: 40px; background: oklch(0.7 0.02 300 / 0.5);\"><\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 14px; color: oklch(0.26 0.02 300);\">\n      <div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.55 0.17 345); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0; color: white;\">10+<\u002Fdiv>\n      <div>\n        <div style=\"font-weight: 700; font-size: 17px;\">שנות ניסיון<\u002Fdiv>\n        <div style=\"font-size: 13px; color: oklch(0.42 0.02 300);\">בהובלת נשים לגוף חזק ובטוח<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width: 1px; height: 40px; background: oklch(0.7 0.02 300 / 0.5);\"><\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 14px; color: oklch(0.26 0.02 300);\">\n      <div style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.55 0.17 345); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0; color: white;\">100%<\u002Fdiv>\n      <div>\n        <div style=\"font-weight: 700; font-size: 17px;\">סביבה נשית<\u002Fdiv>\n        <div style=\"font-size: 13px; color: oklch(0.42 0.02 300);\">מרחב בטוח, בלי שיפוטיות<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PERSONAL STORY -->\n  <section data-screen-label=\"story\" style=\"display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 72px; padding: 120px 64px; align-items: center; max-width: 1400px; margin: 0 auto;\">\n    <div style=\"border-radius: 24px; overflow: hidden; aspect-ratio: 4/5;\">\n      <image-slot id=\"story-photo\" shape=\"rect\" placeholder=\"תמונה אישית של המאמנת\" style=\"width: 100%; height: 100%;\" src=\"6cda16d4-c9d0-4371-b87b-b4a1eebc7dd9\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n      <div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: oklch(0.55 0.17 345);\">הסיפור שלי<\u002Fdiv>\n      <h2 style=\"font-family: 'Heebo', sans-serif; font-size: 38px; font-weight: 800; margin: 0; line-height: 1.25; color: oklch(0.22 0.015 30);\">\n        מהתמודדות עם הפרעת אכילה — לריפוי דרך כוח\n      <\u002Fh2>\n      <p style=\"font-size: 18px; color: oklch(0.4 0.015 30); margin: 0;\">\n        בילדותי ובגיל ההתבגרות נאבקתי שנים עם הפרעת אכילה. היחס שלי לגוף שלי היה יחס של מלחמה — שקילות, הגבלות, ותחושת כישלון מתמדת.\n      <\u002Fp>\n      <p style=\"font-size: 18px; color: oklch(0.4 0.015 30); margin: 0;\">\n        השינוי האמיתי קרה כשהחלפתי את המשקל בברזל. אימוני הכוח לימדו אותי להקשיב לגוף שלי, לראות אותו כשותף ולא כאויב, ולבנות ביטחון שלא תלוי במספר על הסקאלה.\n      <\u002Fp>\n      <p style=\"font-size: 18px; color: oklch(0.4 0.015 30); margin: 0;\">\n        היום אני מלמדת נשים אחרות את מה שגילתי בדרך הקשה: שכוח אמיתי הוא הדרך הבריאה ביותר להרגיש טוב עם עצמך.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PHILOSOPHY -->\n  <section data-screen-label=\"philosophy\" style=\"background: linear-gradient(120deg, oklch(0.95 0.045 350), oklch(0.93 0.045 230)); padding: 130px 64px; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0; background: radial-gradient(circle at 85% 20%, oklch(0.9 0.06 230 / 0.5), transparent 55%);\"><\u002Fdiv>\n    <div style=\"max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 80px; position: relative;\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: oklch(0.5 0.17 345);\">אני מאמינה<\u002Fdiv>\n        <h2 style=\"font-family: 'Heebo', sans-serif; font-size: 42px; font-weight: 800; margin: 0; color: oklch(0.24 0.02 300); line-height: 1.25;\">כושר כאורח חיים — לא עונש שגוזרים על הגוף<\u002Fh2>\n        <p style=\"font-size: 17px; color: oklch(0.42 0.02 300); margin: 0; max-width: 400px;\">ארבע עקרונות שמנחים כל תוכנית שאני בונה — כדי שהאימונים יהיו מקום שאת רוצה לחזור אליו, לא חובה שאת נמלטת ממנה.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: grid; grid-template-columns: 70px 1fr; gap: 24px; padding: 28px 0; border-bottom: 1px solid oklch(0.4 0.05 345 / 0.4);\">\n          <div style=\"font-family: 'Heebo', sans-serif; font-size: 32px; font-weight: 800; color: oklch(0.55 0.17 345);\">01<\u002Fdiv>\n          <div>\n            <h3 style=\"font-size: 21px; font-weight: 700; margin: 0 0 8px; color: #B23E88\">בר-קיימא לטווח ארוך<\u002Fh3>\n            <p style=\"font-size: 16px; color: oklch(0.42 0.02 300); margin: 0\">תוכנית שאפשר לחיות איתה — לא דיאטת קראש שנגמרת בעוד ריבאונד.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 70px 1fr; gap: 24px; padding: 28px 0; border-bottom: 1px solid oklch(0.4 0.05 345 / 0.4);\">\n          <div style=\"font-family: 'Heebo', sans-serif; font-size: 32px; font-weight: 800; color: oklch(0.55 0.17 345);\">02<\u002Fdiv>\n          <div>\n            <h3 style=\"font-size: 21px; font-weight: 700; margin: 0 0 8px; color: #B23E88; position: relative\">מותאם לכל רמה<\u002Fh3>\n            <p style=\"font-size: 16px; color: oklch(0.42 0.02 300); margin: 0\">מהצעד הראשון בחדר כושר ועד מתאמנות מתקדמות — הכל בהתאמה אישית.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 70px 1fr; gap: 24px; padding: 28px 0; border-bottom: 1px solid oklch(0.4 0.05 345 / 0.4);\">\n          <div style=\"font-family: 'Heebo', sans-serif; font-size: 32px; font-weight: 800; color: oklch(0.55 0.17 345);\">03<\u002Fdiv>\n          <div>\n            <h3 style=\"font-size: 21px; font-weight: 700; margin: 0 0 8px; color: #B23E88\">בלי תרבות דיאטות<\u002Fh3>\n            <p style=\"font-size: 16px; color: oklch(0.42 0.02 300); margin: 0\">בלי הגבלות רעילות, בלי אשמה על אוכל — יחס בריא לגוף ולנפש.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 70px 1fr; gap: 24px; padding: 28px 0;\">\n          <div style=\"font-family: 'Heebo', sans-serif; font-size: 32px; font-weight: 800; color: oklch(0.55 0.17 345);\">04<\u002Fdiv>\n          <div>\n            <h3 style=\"font-size: 21px; font-weight: 700; margin: 0 0 8px; color: #B23E88\">כוח שרואים בחיים היומיום<\u002Fh3>\n            <p style=\"font-size: 16px; color: oklch(0.42 0.02 300); margin: 0\">מגרירת המזוודה ועד הרמת שקיות קניות — הכוח שבונים כאן מורגש בכל יום.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONCERNS / OBJECTION HANDLING -->\n  <section data-screen-label=\"concerns\" style=\"padding: 130px 64px; background: oklch(0.97 0.015 350);\">\n    <div style=\"max-width: 1300px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 72px;\">\n        <div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: oklch(0.55 0.17 345); margin-bottom: 12px;\">שאלות שכל אישה שואלת<\u002Fdiv>\n        <h2 style=\"font-family: 'Heebo', sans-serif; font-size: 40px; font-weight: 800; margin: 0; color: oklch(0.22 0.015 30);\">בלי חששות. רק תוצאות.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;\">\n        <div style=\"background: white; border-radius: 24px; padding: 48px 36px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 48px -28px oklch(0.3 0.05 345 / 0.35); border-top: 4px solid oklch(0.55 0.17 345);\">\n          \n          <h3 style=\"font-size: 21px; font-weight: 700; margin: 0; color: oklch(0.22 0.015 30); text-align: right\">בלי שקילות ובלי מעקב היקפים<\u002Fh3>\n          <p style=\"font-size: 16px; color: oklch(0.45 0.015 30); margin: 0; line-height: 1.6; text-align: center\">אנחנו לא מודדות הצלחה במספרים על סקאלה. ההתקדמות נמדדת בכוח, באנרגיה ובביטחון.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: white; border-radius: 24px; padding: 48px 36px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 48px -28px oklch(0.3 0.05 345 / 0.35); border-top: 4px solid oklch(0.55 0.17 345);\">\n          \n          <h3 style=\"font-size: 21px; font-weight: 700; margin: 0; color: oklch(0.22 0.015 30); text-align: center\">משקולות לא \"מנפחות\" אותך<\u002Fh3>\n          <p style=\"font-size: 16px; color: oklch(0.45 0.015 30); margin: 0; line-height: 1.6; text-align: center\">אימוני כוח בונים מבנה גוף חטוב ונשי — לא מסה שרירית מוגזמת. הפיזיולוגיה הנשית פשוט לא עובדת כך.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: white; border-radius: 24px; padding: 48px 36px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 48px -28px oklch(0.3 0.05 345 / 0.35); border-top: 4px solid oklch(0.55 0.17 345);\">\n          \n          <h3 style=\"font-size: 21px; font-weight: 700; margin: 0; color: oklch(0.22 0.015 30); text-align: center\">מותאם לרמת הכושר שלך<\u002Fh3>\n          <p style=\"font-size: 16px; color: oklch(0.45 0.015 30); margin: 0; line-height: 1.6; text-align: center\">מתחילה לגמרי? מתאמנת עם ניסיון? כל תוכנית נבנית אישית, בהתאם לנקודת ההתחלה שלך.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- AUDIENCE -->\n  \n\n  <!-- FAQ -->\n  <section data-screen-label=\"audience\" style=\"background: linear-gradient(120deg, oklch(0.95 0.045 350), oklch(0.93 0.045 230)); padding: 80px 64px;\">\n  <div style=\"max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center;\">\n    <div style=\"display: flex; flex-direction: column; gap: 22px; color: oklch(0.24 0.02 300);\">\n      <div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: oklch(0.5 0.17 345);\">למי זה מתאים<\u002Fdiv>\n      \n      <h2 style=\"font-family: 'Heebo', sans-serif; font-size: 36px; font-weight: 800; margin: 0; line-height: 1.3; text-align: right\">\n        לנערות ולנשים שרוצות להרגיש טוב בגוף שלהן — בסביבה בטוחה ונשית בלבד\n      <\u002Fh2><p style=\"font-size: 17px; color: oklch(0.4 0.02 300); margin: 0;\">\n        בלי עיניים בוחנות, בלי תחרותיות, בלי אזור נוחות של אף אחד מלבדך. סטודיו שנבנה במיוחד כדי שתוכלי להתאמן בביטחון מלא — מהצעד הראשון ועד ההצלחה שלך.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-radius: 24px; overflow: hidden; aspect-ratio: 4/5; max-width: 380px; justify-self: center;\">\n      <image-slot id=\"audience-1\" shape=\"rect\" placeholder=\"אימון קבוצתי נשים\" style=\"width: 100%; height: 100%;\" src=\"f82b7108-c702-4c61-9780-a4d30bf59c10\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection><section data-screen-label=\"faq\" style=\"padding: 110px 64px; max-width: 900px; margin: 0 auto;\">\n    <div style=\"text-align: center; margin-bottom: 56px;\">\n      <div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: oklch(0.55 0.17 345); margin-bottom: 12px;\">שאלות נפוצות<\u002Fdiv>\n      <h2 style=\"font-family: 'Heebo', sans-serif; font-size: 36px; font-weight: 800; margin: 0; color: oklch(0.22 0.015 30);\">כל מה שרצית לדעת לפני שמתחילות<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"5\">\n        <div style=\"border: 1px solid oklch(0.9 0.01 30); border-radius: 16px; overflow: hidden; background: white;\">\n          <div sc-camel-on-click=\"{{ item.toggle }}\" style=\"display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; cursor: pointer; gap: 16px;\">\n            <span style=\"font-size: 17px; font-weight: 600; color: oklch(0.24 0.015 30);\">{{ item.q }}<\u002Fspan>\n            <span style=\"font-size: 22px; color: oklch(0.55 0.17 345); flex-shrink: 0; transform: {{ item.iconTransform }};\">+<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 0 26px 24px; font-size: 15.5px; color: oklch(0.45 0.015 30); margin: 0;\">{{ item.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER CTA -->\n  <section data-screen-label=\"footer-cta\" style=\"background: linear-gradient(135deg, oklch(0.55 0.17 345), oklch(0.45 0.14 345)); padding: 100px 64px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 24px;\">\n    <h2 style=\"font-family: 'Heebo', sans-serif; font-size: 42px; font-weight: 800; margin: 0; color: white; max-width: 700px; line-height: 1.3;\">\n      מוכנה להתחיל לבנות את הגוף והביטחון שלך?\n    <\u002Fh2>\n    <p style=\"font-size: 18px; color: oklch(0.97 0.02 350); margin: 0; max-width: 560px;\">\n      שיחת ההיכרות היא ההזדמנות שלך לשאול הכל, ולתאם תוכנית שמתאימה בדיוק לך.\n    <\u002Fp>\n    <a href=\"https://wa.me/972500000000?text=%D7%94%D9%99%D7%99%2C%20%D7%90%D7%A0%D7%99%20%D7%9E%D7%A2%D7%95%D7%A0%D7%99%D7%99%D7%A0%D7%AA%20%D7%91%D7%A9%D7%99%D7%97%D7%AA%20%D7%94%D9%99%D7%9B%D7%A8%D7%95%D7%AA\" style=\"display: inline-flex; align-items: center; gap: 10px; background: white; color: oklch(0.5 0.17 345); font-size: 18px; font-weight: 700; padding: 18px 40px; border-radius: 999px; box-shadow: 0 12px 28px -8px oklch(0.2 0 0 / 0.35); margin-top: 8px;\">\n      תיאום שיחת היכרות בוואטסאפ\n    <\u002Fa>\n    <div style=\"font-size: 14px; color: oklch(0.95 0.02 350); margin-top: 16px;\">© 2026 · סטודיו אימוני כוח לנשים<\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    faqs: [\n      { q: 'האם צריך ניסיון קודם באימוני כוח?', a: 'לא. התוכנית נבנית מהצעד הראשון שלך, גם אם מעולם לא נגעת במשקולת. נתחיל בקצב שמתאים לך ונתקדם בהדרגה.' },\n      { q: 'אני מפחדת שאהיה \"גדולה\" מדי — זה נכון?', a: 'הפחד הזה נפוץ אבל לא מבוסס. אימוני כוח בונים מבנה גוף חטוב ומוגדר, לא מסה שרירית מוגזמת — הפיזיולוגיה הנשית פשוט לא בונה כך בקלות.' },\n      { q: 'האם תדרשי ממני לעקוב אחרי הקלוריות שלי?', a: 'לא. אין כאן מעקב תזונה כפייתי, שקילות או ספירת קלוריות. הדגש הוא על יחס בריא לגוף ולתהליך, לא על מספרים.' },\n      { q: 'האם האימונים אישיים או קבוצתיים?', a: 'יש לך אפשרות לבחור — אימונים פרטניים בהתאמה מלאה, או קבוצות קטנות באווירה נשית ותומכת.' },\n      { q: 'כמה זמן לוקח לראות שינוי?', a: 'זה תלוי בנקודת ההתחלה ובעקביות, אבל רוב המתאמנות מתחילות להרגיש שינוי בכוח ובביטחון תוך מספר שבועות של עבודה עקבית.' }\n    ]\n  };\n  toggleFaq(i) {\n    this.setState(s => ({\n      faqs: s.faqs.map((f, idx) => idx === i ? { ...f, open: !f.open } : f)\n    }));\n  }\n  renderVals() {\n    return {\n      faqs: this.state.faqs.map((f, i) => ({\n        q: f.q, a: f.a, open: !!f.open,\n        iconTransform: f.open ? 'rotate(45deg)' : 'rotate(0deg)',\n        toggle: () => this.toggleFaq(i)\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
